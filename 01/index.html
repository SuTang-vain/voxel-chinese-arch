<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>紫微宫 · 体素中式古典建筑群</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #12100e; }
      body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #hud {
        position: fixed; left: 18px; top: 16px; z-index: 10;
        color: #f3e6cd; text-shadow: 0 1px 3px rgba(0,0,0,.85);
        pointer-events: none; user-select: none;
      }
      #hud h1 { font-size: 19px; letter-spacing: .32em; font-weight: 600; }
      #hud p  { font-size: 11.5px; opacity: .72; margin-top: 5px; letter-spacing: .12em; }

      #panel {
        position: fixed; right: 16px; top: 16px; z-index: 10;
        display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
      }
      .row { display: flex; gap: 6px; }
      button {
        font: inherit; font-size: 12px; letter-spacing: .08em;
        padding: 6px 11px; border-radius: 3px; cursor: pointer;
        color: #f0e2c6; background: rgba(28,22,18,.62);
        border: 1px solid rgba(216,166,63,.45);
        backdrop-filter: blur(6px);
        transition: background .18s, border-color .18s, color .18s;
      }
      button:hover { background: rgba(216,166,63,.22); border-color: rgba(216,166,63,.85); }
      button.on { background: rgba(216,166,63,.85); color: #241a0d; border-color: rgba(255,225,150,.95); font-weight: 600; }

      #stats {
        position: fixed; left: 18px; bottom: 14px; z-index: 10;
        font-size: 11px; letter-spacing: .06em; color: #e8d9bb; opacity: .62;
        text-shadow: 0 1px 3px rgba(0,0,0,.8); user-select: none;
      }
      #legend {
        position: fixed; right: 16px; bottom: 14px; z-index: 10;
        font-size: 11px; line-height: 1.75; text-align: right;
        color: #e8d9bb; opacity: .6; text-shadow: 0 1px 3px rgba(0,0,0,.8);
        user-select: none;
      }
      #loading {
        position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
        background: #14110e; color: #e5c98a; letter-spacing: .3em; font-size: 13px;
        transition: opacity .7s ease; 
      }
      #loading.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <h1>紫 微 宫</h1>
      <p>VOXEL · CHINESE CLASSICAL ARCHITECTURE</p>
    </div>

    <div id="panel">
      <div class="row" id="times"></div>
      <div class="row">
        <button id="btnRotate" class="on">自动巡游</button>
        <button id="btnShadow" class="on">阴影</button>
      </div>
    </div>

    <div id="stats">—</div>
    <div id="legend">
      左键拖拽 · 旋转视角<br />
      滚轮 · 推拉镜头<br />
      右键拖拽 · 平移
    </div>
    <div id="loading">营 造 中 …</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
