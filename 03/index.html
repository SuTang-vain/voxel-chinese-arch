<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体素 · 中国古典建筑群</title>
  <meta name="description" content="Minecraft 体素方块风格的中式古典建筑群 3D 场景：重檐庑殿主殿、歇山配殿、钟鼓楼与五层宝塔，中轴对称院落，纯 Three.js 程序化生成。" />
  <meta name="theme-color" content="#1a1a1a" />
  <!-- 社交分享卡片（canvas 内容无法被爬取，需显式给出标题与描述） -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="体素 · 中国古典建筑群" />
  <meta property="og:description" content="中轴对称院落 · 重檐庑殿主殿 / 歇山配殿 / 钟鼓楼 / 五层宝塔，约 1.5 万体素、33 个 draw call。" />
  <meta name="twitter:card" content="summary" />
  <!-- 内联 SVG favicon：零额外请求，file:// 与任意子路径下均可用 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%20shape-rendering='crispEdges'%3E%3Crect%20x='2'%20y='2'%20width='12'%20height='2'%20fill='%23d9a832'/%3E%3Crect%20x='1'%20y='4'%20width='14'%20height='2'%20fill='%23b0811f'/%3E%3Crect%20x='4'%20y='6'%20width='8'%20height='6'%20fill='%23a83c30'/%3E%3Crect%20x='7'%20y='8'%20width='2'%20height='4'%20fill='%2338271b'/%3E%3Crect%20x='3'%20y='12'%20width='10'%20height='2'%20fill='%239aa1a8'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; }
    #app { width: 100vw; height: 100vh; }
    .hud {
      position: fixed; left: 16px; top: 14px; color: #fff;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      text-shadow: 0 1px 4px rgba(0,0,0,.55); pointer-events: none; user-select: none;
    }
    .hud h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 2px; }
    .hud p { font-size: 12px; margin: 0; opacity: .85; }
    #fps {
      position: fixed; right: 14px; top: 12px; color: #ffe9b0;
      font: 12px/1.4 Menlo, monospace; text-shadow: 0 1px 3px rgba(0,0,0,.6);
      pointer-events: none; user-select: none;
    }
    /* 窄屏（手机竖屏）下缩小标题，避免与右上角 FPS 计数重叠 */
    @media (max-width: 560px) {
      .hud h1 { font-size: 15px; letter-spacing: 1px; }
      .hud p { font-size: 11px; }
      #fps { font-size: 11px; }
    }

    /* ---------- 启动占位 / 降级提示 ---------- */
    #boot {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #1a1a1a; color: #e8d9a8; text-align: center;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: opacity .45s ease; padding: 0 24px; box-sizing: border-box;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .cube {
      width: 26px; height: 26px; margin: 0 auto 16px;
      background: #d9a832; box-shadow: 0 0 0 4px #b0811f inset;
      animation: bob 1.1s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    #boot-msg { font-size: 14px; margin: 0 0 8px; letter-spacing: 1px; }
    #boot-hint { font-size: 12px; margin: 0; opacity: .62; line-height: 1.7; max-width: 34em; }
    #boot.fatal .cube { animation: none; background: #a83c30; box-shadow: none; }
    #boot.fatal #boot-msg { color: #ff9d8a; font-size: 16px; }
    @media (prefers-reduced-motion: reduce) { #boot .cube { animation: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <h1>体素 · 中国古典建筑群</h1>
    <p>拖拽旋转 / 滚轮缩放 / 右键平移</p>
  </div>
  <div id="fps"></div>

  <!-- 首帧渲染完成后由 main.js 移除；WebGL 不可用时改写为降级提示 -->
  <div id="boot">
    <div>
      <div class="cube" aria-hidden="true"></div>
      <p id="boot-msg">正在生成体素场景…</p>
      <p id="boot-hint">约 1.5 万个体素方块 · 首次加载需解析三维资源</p>
    </div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#1a1a1a;color:#e8d9a8;font-family:sans-serif;z-index:20">
      本页面是一个 WebGL 三维场景，需要启用 JavaScript 才能观看。
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
