<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>城市瞬间 · New Street Scenes</title>
<style>
  :root {
    --c-bg: #F4F1EA;
    --c-ink: #1A1815;
    --c-soft: rgba(26, 24, 21, 0.62);
    --c-faint: rgba(26, 24, 21, 0.42);
    --c-line: rgba(26, 24, 21, 0.22);
    --serif-en: 'Didot', 'Baskerville', 'Georgia', 'Times New Roman', serif;
    --serif-cn: 'Songti SC', 'STSong', serif;
  }

  @page { size: 720px 1080px; margin: 0; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    margin: 0;
    padding: 0;
    background: #F4F1EA;
  }

  .poster {
    width: 720px;
    height: 1080px;
    background: var(--c-bg);
    color: var(--c-ink);
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  .head {
    padding: 44px 52px 30px;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
  }
  .head-main { flex: 1; min-width: 0; padding-right: 30px; }

  .kicker-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .headline {
    font-family: var(--serif-en), serif;
    font-weight: 600;
    font-size: 50px;
    line-height: 1.04;
    letter-spacing: 0.005em;
    white-space: nowrap;
  }
  .tagline {
    font-family: var(--serif-en), serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.26em;
    line-height: 1.8;
    color: var(--c-soft);
    border-left: 1px solid var(--c-line);
    padding-left: 14px;
    transform: translateY(-4px);
    white-space: nowrap;
  }

  .title-row {
    margin-top: 26px;
    display: flex;
    align-items: baseline;
    gap: 22px;
  }
  .cn-title {
    font-family: var(--serif-cn), serif;
    font-weight: 900;
    font-size: 52px;
    line-height: 1;
    letter-spacing: 0.045em;
    white-space: nowrap;
  }
  .dates {
    font-family: var(--serif-cn), serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.14em;
    color: var(--c-soft);
    white-space: nowrap;
  }
  .dates::before {
    content: "";
    display: inline-block;
    width: 26px;
    height: 1px;
    background: var(--c-line);
    vertical-align: middle;
    margin-right: 14px;
  }

  /* Vertical theme line */
  .theme {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding-top: 6px;
  }
  .theme-line {
    writing-mode: vertical-rl;
    text-orientation: upright;
    white-space: nowrap;
    font-family: var(--serif-cn), serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.62em;
    color: var(--c-ink);
  }
  .theme-rule {
    width: 1px;
    height: 264px;
    background: var(--c-line);
    margin-top: 4px;
  }

  /* ---------- Info block ---------- */
  .info {
    margin: 0 52px;
    border-top: 1px solid var(--c-line);
    padding: 22px 0 26px;
    display: grid;
    grid-template-columns: 0.78fr 1.27fr 1.15fr;
    column-gap: 28px;
  }
  .cell + .cell { border-left: 1px solid var(--c-line); padding-left: 28px; }
  .label {
    font-family: var(--serif-en), serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.3em;
    color: var(--c-faint);
    margin-bottom: 11px;
    white-space: nowrap;
  }
  .value {
    font-family: var(--serif-cn), serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .value .en { font-family: var(--serif-en), serif; letter-spacing: 0.05em; }
  .sub {
    margin-top: 7px;
    font-family: var(--serif-cn), serif;
    font-weight: 400;
    font-size: 12.5px;
    letter-spacing: 0.1em;
    color: var(--c-soft);
    white-space: nowrap;
  }

  /* ---------- Photograph ---------- */
  .photo {
    flex: 1;
    min-height: 0;
    width: 720px;
    position: relative;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ---------- Footer ---------- */
  .foot {
    border-top: 1px solid var(--c-line);
    margin: 0 52px;
    padding: 19px 0 30px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 20px;
  }
  .foot-cn {
    font-family: var(--serif-cn), serif;
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.16em;
    white-space: nowrap;
  }
  .foot-plan {
    font-family: var(--serif-cn), serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--c-soft);
    white-space: nowrap;
  }
  .foot-en {
    font-family: var(--serif-en), serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.24em;
    color: var(--c-faint);
    white-space: nowrap;
  }

  /* Browser preview auto-scale (print output unaffected) */
  @media screen {
    html {
      height: auto;
      display: flex;
      justify-content: center;
      background: #F4F1EA;
    }
    body {
      transform-origin: top center;
      scale: min(1, calc(100vw / 720), calc(100vh / 1080));
      margin: 0 auto;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.12);
    }
  }
</style>
</head>
